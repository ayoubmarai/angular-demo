<section class="liste-cours">
  @for (c of cours; track c.titre) {
    <article class="carte-cours container" [class.actif]="c === coursActif" (click)="selectionner(c)">
      <span class="carte-cours-titre">
        <h3 >{{ c.titre }}</h3>
        <span class="badge" [ngClass]="{
          'bg-success': c.categorie.toLocaleLowerCase() == 'langage',
          'bg-primary': c.categorie.toLocaleLowerCase() == 'back-end',
          'bg-warning': c.categorie.toLocaleLowerCase() == 'outils',
          'bg-secondary': c.categorie
        }">{{ c.categorie }}</span>
      </span>
      <p class="carte-cours-duree">Durée : {{ c.duree }}</p>
      <p class="carte-cours-places">Places disponibles : {{ c.places }}</p>
    </article>
  }
</section>
