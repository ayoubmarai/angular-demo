<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>TP</title>
  </head>

  <body>
    <app-tete></app-tete>
    <nav class="menu">
      <a routerLink="/" routerLinkActive="actif" [routerLinkActiveOptions]="{ exact: true }"
        >Accueil</a
      >
      <a routerLink="/cours" routerLinkActive="actif">Catalogue</a>
      <a routerLink="/mes-inscriptions" routerLinkActive="actif">Mes inscriptions</a>
      @if (session.connecte()) {
        <button (click)="deconnecter()">Déconnexion ({{ session.nom() }})</button>
      } @else {
        <a routerLink="/connexion" routerLinkActive="actif">Connexion</a>
      }
    </nav>
    <main>
      <router-outlet />
    </main>
    @defer (on viewport) {
      <app-pied></app-pied>
    } @placeholder {
      <div class="pied-page-placeholder">...</div>
    } @loading {
      <p>Chargement...</p>
    }
  </body>
</html>
